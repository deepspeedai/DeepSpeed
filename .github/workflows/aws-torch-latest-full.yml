################################################################################
# DeepSpeed CI - AWS L40S GPU Full Tests (PyTorch Latest)
#
# The default branch keeps the scheduled full-suite workflow. This test branch
# narrows manual dispatches to one PR 8654 diagnostic so the native AWS runner
# can be compared with the matching Modal setup without changing nightly CI.
################################################################################

name: aws-torch-latest-full

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Check for commits since last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="${{ github.event.repository.default_branch }}"

          last_sha=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/aws-torch-latest-full.yml/runs?status=success&event=schedule&branch=${default_branch}&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')

          current_sha="${{ github.sha }}"

          if [ -z "$last_sha" ]; then
            echo "No previous successful run found - running tests"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$last_sha" = "$current_sha" ]; then
            echo "No new commits since last successful run ($last_sha) - skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected: $last_sha -> $current_sha - running tests"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: PR 8654 native AWS comparison
    needs: [check-changes]
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.has_changes == 'true')
    runs-on: [self-hosted, gpu-ci, gpu-l40s, l40s-4gpu, aws]
    timeout-minutes: 120

    container:
      image: pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel
      # The native fleet has four physical L40S GPUs. Expose exactly two so the
      # test sees the same visible-device count as the Modal comparison.
      options: >-
        --gpus 2
        --shm-size "32G"

    env:
      MODAL_TORCH_PRESET: '2.11.0-cuda12.8'
      TRANSFORMERS_REF: '080c288fe607ef54cd4a469608f4d82ac4dd4d4d'
      PYTORCH_INDEX_URL: 'https://download.pytorch.org/whl/cu128'
      TEST_SELECTION_FILE: 'ci/modal_diagnostics/pr8654_71_nodes.txt'
      NO_PROGRESS_TIMEOUT_SECONDS: '1200'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git libaio-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          submodules: false

      - name: Select the Modal Python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.13'

      - name: Resolve the Modal preset from the shared controller
        run: |
          python - <<'PY'
          import os
          from ci.torch_latest import MODAL_TORCH_PRESETS

          preset_name = os.environ["MODAL_TORCH_PRESET"]
          preset = MODAL_TORCH_PRESETS[preset_name]
          expected_image = "pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel"
          if preset["image"] != expected_image:
              raise SystemExit(f"container drift: {preset['image']} != {expected_image}")

          values = {
              "TORCH_PACKAGE": preset["torch_package"],
              "TORCHVISION_PACKAGE": preset["torchvision_package"],
              "TORCH_TEST_VERSION": preset["torch_test_version"],
              "CUDA_TEST_VERSION": preset["cuda_test_version"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          print({"preset": preset_name, "image": preset["image"], **values})
          PY

      - name: Install Python requirements
        run: |
          python -m pip install -r requirements/requirements.txt
          python -m pip install -r requirements/requirements-dev.txt
          python -m pip install -r requirements/requirements-deepcompile.txt

      - name: Re-pin PyTorch from the Modal preset
        run: |
          python -m pip install \
            "$TORCH_PACKAGE" \
            "$TORCHVISION_PACKAGE" \
            --index-url "$PYTORCH_INDEX_URL"

      - name: Install pinned Transformers
        run: |
          git init /tmp/transformers
          git -C /tmp/transformers fetch \
            --no-tags \
            --no-recurse-submodules \
            --depth=1 \
            https://github.com/huggingface/transformers.git \
            "$TRANSFORMERS_REF"
          git -C /tmp/transformers checkout --detach FETCH_HEAD
          test "$(git -C /tmp/transformers rev-parse HEAD)" = "$TRANSFORMERS_REF"
          python -m pip install /tmp/transformers

      - name: Install DeepSpeed
        run: python -m pip install .

      - name: Check exact environment and GPU visibility
        run: |
          nvidia-smi --query-gpu=index,name,driver_version,memory.total,compute_cap --format=csv
          nvcc --version
          python --version
          python - <<'PY'
          import json
          import os

          import torch
          import torchvision
          import transformers

          device_count = torch.cuda.device_count()
          details = {
              "cuda_visible_devices": os.environ.get("CUDA_VISIBLE_DEVICES"),
              "python_cuda_available": torch.cuda.is_available(),
              "python_device_count": device_count,
              "python_devices": [torch.cuda.get_device_name(index) for index in range(device_count)],
              "torch": torch.__version__,
              "torch_cuda": torch.version.cuda,
              "torchvision": torchvision.__version__,
              "transformers": transformers.__version__,
          }
          print(json.dumps(details, indent=2, sort_keys=True))
          if device_count != 2:
              raise SystemExit(f"expected exactly 2 visible GPUs, observed {device_count}")
          if any("L40S" not in name for name in details["python_devices"]):
              raise SystemExit(f"expected two NVIDIA L40S devices, observed {details['python_devices']}")
          PY
          python -m deepspeed.env_report

      - name: Validate the exact test selection
        run: |
          python ci/torch_latest.py validate-selection \
            --mode subset \
            --path "$TEST_SELECTION_FILE"
          test "$(wc -l < "$TEST_SELECTION_FILE" | tr -d ' ')" = 1
          test "$(sed -n '1p' "$TEST_SELECTION_FILE")" = \
            'tests/unit/v1/zero/test_zero2_gradient_safety.py::test_two_rank_offload_and_nonoffload_training'

      - name: Run the Modal-generated pytest command
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/aws-native-pr8654
        run: |
          python - <<'PY'
          import os
          import queue
          import signal
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path

          from ci.torch_latest import ControllerInputs, build_remote_commands, load_test_selection

          selection_file = Path(os.environ["TEST_SELECTION_FILE"])
          targets = load_test_selection(selection_file, "subset")
          inputs = ControllerInputs(
              repository="deepspeedai/DeepSpeed",
              sha=os.environ["GITHUB_SHA"],
              selection_mode="subset",
              targets=targets,
              torch_preset=os.environ["MODAL_TORCH_PRESET"],
              transformers_source="git",
              transformers_ref=os.environ["TRANSFORMERS_REF"],
              base_sha=os.environ["GITHUB_SHA"],
          )
          pytest_command = next(command for command in build_remote_commands(inputs) if command.label == "run pytest")
          argv = list(pytest_command.argv)
          print("Executing:", " ".join(argv), flush=True)

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          artifact_dir.mkdir(parents=True, exist_ok=True)
          log_path = artifact_dir / "pytest.log"
          timeout_seconds = int(os.environ["NO_PROGRESS_TIMEOUT_SECONDS"])
          output_queue: queue.Queue[str | None] = queue.Queue()
          process = subprocess.Popen(
              argv,
              cwd=os.environ["GITHUB_WORKSPACE"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
              start_new_session=True,
          )

          def copy_output() -> None:
              assert process.stdout is not None
              for line in process.stdout:
                  output_queue.put(line)
              output_queue.put(None)

          reader = threading.Thread(target=copy_output, daemon=True)
          reader.start()
          last_output = time.monotonic()
          stream_closed = False
          with log_path.open("w", encoding="utf-8") as log_file:
              while process.poll() is None or not stream_closed:
                  try:
                      line = output_queue.get(timeout=5)
                  except queue.Empty:
                      if process.poll() is None and time.monotonic() - last_output >= timeout_seconds:
                          print(f"No pytest output for {timeout_seconds} seconds; terminating the test process group.",
                                flush=True)
                          os.killpg(process.pid, signal.SIGTERM)
                          try:
                              process.wait(timeout=15)
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid, signal.SIGKILL)
                          raise SystemExit(124)
                      continue
                  if line is None:
                      stream_closed = True
                      continue
                  last_output = time.monotonic()
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  log_file.write(line)
                  log_file.flush()

          raise SystemExit(process.wait())
          PY

      - name: Upload comparison log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-native-pr8654-comparison
          path: ${{ runner.temp }}/aws-native-pr8654
          if-no-files-found: warn
          retention-days: 14
